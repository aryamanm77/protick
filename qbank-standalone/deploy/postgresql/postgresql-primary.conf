# PostgreSQL 15/16+ Primary Configuration Snippet for High-Availability LAN Exams
# Append or include in /etc/postgresql/<ver>/main/conf.d/qbank-ha.conf

listen_addresses = '0.0.0.0'
port = 5432
max_connections = 300

# Synchronous-capable Streaming Replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1024MB
hot_standby = on

# Zero-loss durability for acknowledged student responses
synchronous_commit = remote_apply
synchronous_standby_names = 'qbank_standby_1'

archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
