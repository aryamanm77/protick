spring.application.name=qbank-standalone
spring.flyway.enabled=false
server.port=${QBANK_PORT:8443}
server.address=${QBANK_BIND_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

server.ssl.enabled=${QBANK_SSL_ENABLED:false}
server.ssl.key-store=${QBANK_TLS_KEYSTORE:}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${QBANK_TLS_KEYSTORE_PASSWORD:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

qbank.enabled=true
qbank.base-path=${QBANK_BASE_PATH:/qbank}
qbank.auth.mode=standalone
qbank.storage-dir=${QBANK_STORAGE_DIR:./data/qbank-storage}
qbank.retention-days=${QBANK_RETENTION_DAYS:365}

qbank.datasource.url=${QBANK_DB_URL:jdbc:h2:file:./data/qbank-db;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
qbank.datasource.username=${QBANK_DB_USER:qbank}
qbank.datasource.password=${QBANK_DB_PASSWORD:}

qbank.security.encryption-key-file=${QBANK_ENCRYPTION_KEY_FILE:./secrets/qbank-aes.key}
qbank.security.signing-key-file=${QBANK_SIGNING_KEY_FILE:./secrets/qbank-hmac.key}
qbank.engine.service-token=${QBANK_ENGINE_TOKEN:}

qbank.backup.enabled=${QBANK_BACKUP_ENABLED:true}
qbank.backup.daily-cron=${QBANK_BACKUP_CRON:0 0 2 * * *}
qbank.backup.live-session-interval-minutes=${QBANK_BACKUP_LIVE_MINUTES:5}
qbank.backup.keep-last=${QBANK_BACKUP_KEEP_LAST:14}
