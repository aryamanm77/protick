# QBank Standalone LAN Production Configuration Template
# Override these via environment variables or edit locally before launch.
# Never place ./secrets inside ./data.

server.port=8443
server.address=0.0.0.0

# Set QBANK_SSL_ENABLED=true after running scripts/generate-tls-cert.bat (or .sh)
server.ssl.enabled=${QBANK_SSL_ENABLED:false}
server.ssl.key-store=file:./certs/qbank-keystore.p12
server.ssl.key-store-type=PKCS12
# Supply QBANK_TLS_KEYSTORE_PASSWORD via environment variable (never commit plaintext secrets)
server.ssl.key-store-password=${QBANK_TLS_KEYSTORE_PASSWORD:}

qbank.base-path=/qbank
qbank.auth.mode=standalone
qbank.storage-dir=./data/qbank-storage

# Recommended production DB: PostgreSQL primary/standby
# qbank.datasource.url=jdbc:postgresql://10.10.0.10:5432/qbank
# qbank.datasource.username=qbank_app
# qbank.datasource.password=${QBANK_DB_PASSWORD:}

# Default embedded DB option (single-node LAN file DB, WRITE_DELAY=0 for crash durability)
qbank.datasource.url=jdbc:h2:file:./data/qbank-db;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
qbank.datasource.username=qbank
qbank.datasource.password=${QBANK_DB_PASSWORD:}

# External 256-bit keys generated by scripts/generate-keys.bat (or .sh)
qbank.security.encryption-key-file=./secrets/qbank-aes.key
qbank.security.signing-key-file=./secrets/qbank-hmac.key

# Optional engine token if external exam runner pulls frozen papers over HTTPS
qbank.engine.service-token=${QBANK_ENGINE_TOKEN:}

qbank.backup.enabled=true
qbank.backup.daily-cron=0 0 2 * * *
qbank.backup.live-session-interval-minutes=5
qbank.backup.keep-last=30
