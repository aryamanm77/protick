spring.application.name=host-exam-portal
server.port=${HOST_PORT:9090}
server.address=${HOST_BIND_ADDRESS:127.0.0.1}

spring.datasource.url=${HOST_DB_URL:jdbc:h2:file:./data/host-exam-portal;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${HOST_DB_USER:sa}
spring.datasource.password=${HOST_DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# QBank Embedded Drop-In Configuration
qbank.enabled=true
qbank.base-path=/exam-bank
qbank.auth.mode=auto
qbank.storage-dir=${QBANK_STORAGE_DIR:./data/qbank-storage}

qbank.roles.admin=PORTAL_ADMIN
qbank.roles.hod=DEPT_CHAIR
qbank.roles.coe=EXAM_CTRL
qbank.roles.invigilator=HALL_PROCTOR
qbank.roles.room-authority-prefix=EXAM_ROOM:

# Externalized keys (set env vars or key files outside data directory)
qbank.security.encryption-key-base64=${QBANK_ENCRYPTION_KEY:}
qbank.security.encryption-key-file=${QBANK_ENCRYPTION_KEY_FILE:}
qbank.security.signing-key-base64=${QBANK_SIGNING_KEY:}
qbank.security.signing-key-file=${QBANK_SIGNING_KEY_FILE:}
qbank.engine.service-token=${QBANK_ENGINE_TOKEN:}

qbank.backup.enabled=${QBANK_BACKUP_ENABLED:false}
